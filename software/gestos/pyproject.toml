[project]
name = "ast-gestos"
version = "0.1.0"
description = "AllScreenTouch: apuntar y hacer clic con la mano usando una webcam"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.20",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "evdev-binary>=1.7",
]

[project.scripts]
ast-gestos = "ast_gestos.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ast_gestos"]
